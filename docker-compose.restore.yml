# Isolated restore drill only. This project never joins PlateOS production networks.
name: plateos-restore-${PLATEOS_RESTORE_DRILL_ID:?set unique restore drill ID}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  restore-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "70:70"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - ${PLATEOS_RESTORE_SECRETS_GID:?set restore secrets GID}
    environment:
      POSTGRES_USER: plateos_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/plateos_restore_database_password
      POSTGRES_DB: plateos_restore
    volumes:
      - restore_pgdata:/var/lib/postgresql/data
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_restore_database_password
        target: /run/secrets/plateos_restore_database_password
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/postgresql:size=4m,mode=0775,uid=70,gid=70
    networks:
      - restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U plateos_restore -d plateos_restore"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *bounded-logging

  restore:
    restart: "no"
    image: plateos-backup:${PLATEOS_IMAGE_TAG:-development}
    build:
      context: ./ops/backup
      pull: true
    user: "${PLATEOS_BACKUP_UID:-1000}:${PLATEOS_BACKUP_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - ${PLATEOS_RESTORE_SECRETS_GID:?set restore secrets GID}
    environment:
      PLATEOS_RESTORE_CONFIRM: ${PLATEOS_RESTORE_CONFIRM:?set explicit restore confirmation}
      PGHOST: restore-db
      PGPORT: "5432"
      PGUSER: plateos_restore
      PGDATABASE: plateos_restore
    volumes:
      - type: bind
        source: ${PLATEOS_RESTORE_ARCHIVE:?set encrypted archive path}
        target: /restore/plateos.dump.age
        read_only: true
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_restore_identity
        target: /run/secrets/plateos_restore_identity
        read_only: true
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_restore_database_password
        target: /run/secrets/plateos_restore_database_password
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      restore-db:
        condition: service_healthy
    networks:
      - restore
    command: ["restore"]
    logging: *bounded-logging

  verify-api:
    profiles:
      - verification
    image: plateos-api:${PLATEOS_IMAGE_TAG:-development}
    build:
      context: ./backend
      pull: true
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - ${PLATEOS_RESTORE_SECRETS_GID:?set restore secrets GID}
    environment:
      PLATEOS_ENVIRONMENT: production
      PLATEOS_DATABASE_HOST: restore-db
      PLATEOS_DATABASE_PORT: "5432"
      PLATEOS_DATABASE_USER: plateos_restore
      PLATEOS_DATABASE_NAME: plateos_restore
      PLATEOS_COOKIE_SECURE: "true"
      PLATEOS_RUNTIME_SETTINGS_FILE: /srv/data/runtime-settings.json
    volumes:
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_restore_database_password
        target: /run/secrets/plateos_database_password
        read_only: true
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_app_password
        target: /run/secrets/plateos_app_password
        read_only: true
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_session_secret
        target: /run/secrets/plateos_session_secret
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=10001,gid=10001
      - /srv/data:size=4m,mode=0750,uid=10001,gid=10001
    depends_on:
      restore:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - restore
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging: *bounded-logging

  verify:
    profiles:
      - verification
    image: plateos-api:${PLATEOS_IMAGE_TAG:-development}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - ${PLATEOS_RESTORE_SECRETS_GID:?set restore secrets GID}
    volumes:
      - ./ops/backup/verify_restore.py:/verify/verify_restore.py:ro
      - type: bind
        source: ${PLATEOS_RESTORE_SECRETS_DIR:?set restore secrets directory}/plateos_app_password
        target: /run/secrets/plateos_app_password
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=10001,gid=10001
    depends_on:
      verify-api:
        condition: service_healthy
    networks:
      - restore
    command: ["python", "/verify/verify_restore.py"]
    logging: *bounded-logging

networks:
  restore:
    internal: true

volumes:
  restore_pgdata:
